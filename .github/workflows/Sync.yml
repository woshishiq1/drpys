name: Sync repo from zourjke

on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:

jobs:
  sync_zourjke:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write      # 增加这个
      workflows: write    # 关键：明确声明 workflow 写入权限

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}   # 显式传入

      - name: Add upstream and fetch
        run: |
          git remote add upstream_zourjke https://github.com/zourjke/drpy-node.git || true
          git fetch upstream_zourjke --tags --force

      - name: Smart Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_BRANCH=$(git remote show upstream_zourjke | grep 'HEAD branch' | cut -d' ' -f5)
          echo "上游默认分支: $UPSTREAM_BRANCH"

          MY_SCRIPT="Sync.yml"   # ← 改成你实际的文件名

          # 检查是否有实质代码更新（排除 workflow 目录干扰）
          if git diff --quiet origin/main upstream_zourjke/$UPSTREAM_BRANCH -- . ':!.github/workflows'; then
            echo "✅ 上游无新代码更新，跳过"
            exit 0
          fi

          echo "🚀 检测到更新，开始同步..."

          # 备份自己的同步脚本
          mkdir -p /tmp/backup
          cp ".github/workflows/$MY_SCRIPT" /tmp/backup/ 2>/dev/null || true

          # 切换到上游最新状态
          git checkout -B main upstream_zourjke/$UPSTREAM_BRANCH --force

          # 恢复自己的同步脚本
          mkdir -p .github/workflows
          cp /tmp/backup/$MY_SCRIPT .github/workflows/ 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit --allow-empty -m "Sync: zourjke upstream ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))" || echo "Nothing to commit"

          # === 更强力的推送方式 ===
          LOCAL_SHA=$(git rev-parse HEAD)

          echo "通过 GitHub API 强制更新 main 分支..."
          gh api --method PATCH "/repos/${{ github.repository }}/git/refs/heads/main" \
            -f sha="$LOCAL_SHA" \
            -f force=true
          
          echo "🎉 同步完成（含 .github/workflows）"
