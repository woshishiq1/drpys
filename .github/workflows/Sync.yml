name: Sync repo from zourjkeon

on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 唯一任务：智能过滤上游工作流，仅同步全量纯代码
  # ----------------------------------------------------
  sync_zourjke:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add zourjke upstream and fetch
        run: |
          git remote add upstream_zourjke https://github.com/zourjke/drpy-node.git || true
          git fetch upstream_zourjke

      - name: Smart Sync & Filter Workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. 获取上游默认分支
          UPSTREAM_BRANCH=$(git remote show upstream_zourjke | grep 'HEAD branch' | cut -d' ' -f5)
          echo "zourjke 默认分支为: $UPSTREAM_BRANCH"

          # 2. 对比上游和你本地的纯代码（初步过滤）
          if git diff --quiet origin/main upstream_zourjke/$UPSTREAM_BRANCH -- . ':!.github/workflows'; then
            echo "------------------------------------------------"
            echo "✅ 上游纯代码没有新更新。"
            echo "✅ 拒绝同步，优雅退出，不刷新仓库置顶时间。"
            echo "------------------------------------------------"
            exit 0
          fi

          echo "🚀 检测到上游有新代码，准备开始覆盖并验证..."

          # 3. 配置 Git 身份
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 4. 从上游分支拉取所有文件，明确排除 .github/workflows 目录
          git checkout upstream_zourjke/$UPSTREAM_BRANCH -- . ':!.github/workflows'

          # 5. 【核心修复】再次检查本地工作区是否有实质文件修改
          if git diff --quiet && git diff --cached --quiet; then
            echo "------------------------------------------------"
            echo "✅ 覆盖后检查：无任何文件变动。"
            echo "✅ 拒绝空提交，优雅退出，不刷新仓库置顶时间。"
            echo "------------------------------------------------"
            exit 0
          fi

          # 6. 提交实质变动（严格移除 --allow-empty，确保无变动绝不提交）
          git add -A
          git commit -m "Sync: 自动同步 zourjke 纯代码（已过滤上游工作流）"

          # 7. 推送到远程
          echo "正在推送到远程仓库..."
          git push origin main

          echo "🎉 同步成功！已完美同步上游纯代码，并成功过滤上游工作流。"

  # ----------------------------------------------------
  # 任务二：清理历史
  # ----------------------------------------------------
  cleanup_runs:
    runs-on: ubuntu-latest
    needs: sync_zourjke
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 5
