name: Sync repo from zourjke

on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:

jobs:
  # ----------------------------------------------------
  # 唯一任务：利用官方 CLI 完美同步全量代码及工作流（零配置）
  # ----------------------------------------------------
  sync_zourjke:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 保持默认的写入权限即可

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add zourjke upstream and fetch
        run: |
          git remote add upstream_zourjke https://github.com/zourjke/drpy-node.git || true
          git fetch upstream_zourjke

      - name: Smart Sync via GitHub CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 直接借用默认自带的 Token
        run: |
          # 1. 获取上游默认分支
          UPSTREAM_BRANCH=$(git remote show upstream_zourjke | grep 'HEAD branch' | cut -d' ' -f5)
          echo "zourjke 默认分支为: $UPSTREAM_BRANCH"

          # 2. 核心防刷：定义你当前这个同步脚本的名字
          # 📝 注意：请确保大小写一致，如果是 Sync.yml 就写 Sync.yml
          MY_SCRIPT="Sync.yml"
          
          # 3. 核心防刷：对比上游和你本地的纯代码（排除整个工作流目录的干扰）
          if git diff --quiet origin/main upstream_zourjke/$UPSTREAM_BRANCH -- . ':!.github/workflows'; then
            echo "------------------------------------------------"
            echo "✅ 上游没有新代码更新。"
            echo "✅ 拒绝同步，优雅退出，不刷新仓库置顶时间。"
            echo "------------------------------------------------"
            exit 0
          fi

          echo "🚀 检测到上游有新代码，准备开始同步..."

          # 4. 先把本地运行的这个同步脚本备份出来
          mkdir -p /tmp/workflow_backup
          if [ -f ".github/workflows/$MY_SCRIPT" ]; then
            cp ".github/workflows/$MY_SCRIPT" /tmp/workflow_backup/
          fi

          # 5. 【核心大招】利用 GitHub 官方 CLI 工具，强行在云端把上游分支同步过来
          # 这一步是服务器内部同步，会把上游的所有工作流（包括 build-docker.yml）全部带过来
          gh repo sync ${{ github.repository }} --source zourjke/drpy-node --force

          # 6. 云端同步成功后，我们需要把你的同步脚本安全地插回去，防止被上游冲掉
          # 所以我们重新拉取刚刚同步完的最新代码
          git fetch origin main
          git checkout main

          # 7. 把你完好无损的同步脚本放回去
          mkdir -p .github/workflows
          if [ -f "/tmp/workflow_backup/$MY_SCRIPT" ]; then
            cp "/tmp/workflow_backup/$MY_SCRIPT" .github/workflows/
          fi

          # 8. 设置身份并提交你的这个同步脚本（GitHub 允许你修改“当前正在运行”的这一个脚本）
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/$MY_SCRIPT
          
          # 如果你的脚本和上游刚好重名且内容一致，diff 就会为空，加 --allow-empty 防止报错
          git commit --allow-empty -m "Sync: 恢复本地专属同步脚本"
          git push origin main

  # ----------------------------------------------------
  # 任务二：清理历史
  # ----------------------------------------------------
  cleanup_runs:
    runs-on: ubuntu-latest
    needs: sync_zourjke
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 5
